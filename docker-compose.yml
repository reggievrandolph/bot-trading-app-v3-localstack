version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  data_ingestion:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.data
    environment:
      - MODE=${MODE:-simulated}
      - TICKER=${TICKER:-SPY}
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - redis
    profiles:
      - live

  simulated_data_ingestion:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.data
    environment:
      - MODE=simulated
      - TICKER=${TICKER:-SPY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    profiles:
      - simulated

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "5001:5000"
    environment:
      - AWS_ENDPOINT_URL=http://localhost:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - CS_APP_KEY=${CS_APP_KEY}
      - CS_APP_SECRET=${CS_APP_SECRET}
      - CS_CALLBACK_URL=${CS_CALLBACK_URL:-http://localhost:3000/callback}
      - CS_TOKENS_FILE=/app/tokens.json
    volumes:
      - ./backend/tokens.json:/app/tokens.json:ro
    depends_on:
      - redis

  ui-api:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.trading
    ports:
      - "8000:8000"
    environment:
      - MODE=${MODE:-simulated}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - api-gateway

  strategy:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.trading
    environment:
      - MODE=${MODE:-simulated}
      - TICKER=${TICKER:-SPY}
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - redis
      - ui-api

  trader_bot:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.order
    environment:
      - MODE=${MODE:-simulated}
      - TICKER=${TICKER:-SPY}
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - redis
      - strategy

  order_management:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.circuit
    environment:
      - MODE=${MODE:-simulated}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - trader_bot

  frontend:
    build:
      context: ./simple-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
    depends_on:
      - api-gateway

  account:
    build:
      context: ./backend
      dockerfile: lambda/Dockerfile.data
    environment:
      - MODE=${MODE:-simulated}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

volumes:
  redis_data:
